<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0A1830">
<title>Page not found — Hamada Ahmed Ali for Accounting</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/css/style.css">
<style>
  .nf-body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:
    radial-gradient(1100px 620px at 50% -12%, rgba(176,138,50,.14) 0%, transparent 58%),
    linear-gradient(180deg,#132745 0%,#0F2140 55%,#0A1830 100%);
    padding:24px}
  .nf-card{text-align:center;color:#fff;max-width:420px}
  .nf-logo{height:56px;margin:0 auto 26px;opacity:.9}
  .nf-code{font-family:var(--font-heading);font-size:72px;font-weight:700;line-height:1;color:#fff}
  .nf-title{font-size:16px;font-weight:700;letter-spacing:.02em;margin-top:10px;color:#fff}
  .nf-sub{color:#AEC0DE;font-size:13.5px;margin-top:10px;line-height:1.6}
  .nf-rule{width:46px;height:2px;margin:22px auto;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent)}
  .nf-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.68rem 1.4rem;border-radius:9px;background:var(--gold);color:#20190A;font-weight:700;font-size:14px;text-decoration:none;transition:filter .15s,transform .15s}
  .nf-btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
</style>
</head>
<body class="nf-body">
  <div class="nf-card">
    <img src="/assets/logo-white.png" alt="" class="nf-logo">
    <div class="nf-code">404</div>
    <div class="nf-title">Page not found</div>
    <p class="nf-sub">The page you're looking for doesn't exist or may have moved.</p>
    <div class="nf-rule"></div>
    <a class="nf-btn" href="/">Back to sign in</a>
  </div>
</body>
</html>
